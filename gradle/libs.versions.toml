[versions]
curator = "5.9.0"
testcontainers = "2.0.5"
awaitility = "4.3.0"
zookeeper = "3.9.5"
spring-boot = "4.1.1"
nexus-publish = "2.0.0"

[libraries]
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
curator-framework = { module = "org.apache.curator:curator-framework", version.ref = "curator" }
curator-recipes = { module = "org.apache.curator:curator-recipes", version.ref = "curator" }
jspecify = { module = "org.jspecify:jspecify" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
spring-boot = { module = "org.springframework.boot:spring-boot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-starter-aspectj = { module = "org.springframework.boot:spring-boot-starter-aspectj" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
zookeeper = { module = "org.apache.zookeeper:zookeeper", version.ref = "zookeeper" }

[bundles]
curator = ["curator-recipes", "curator-framework"]
testcontainers = ["testcontainers", "testcontainers-jupiter"]

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "spring-boot" }
springDependencyManagement = { id = "io.spring.dependency-management", version = "1.1.7" }
axionRelease = { id = "pl.allegro.tech.build.axion-release", version = "1.21.3" }
nexus-publish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "nexus-publish" }
